services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jupiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jupiter_secret}
      POSTGRES_DB: ${POSTGRES_DB:-jupiter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jupiter} -d ${POSTGRES_DB:-jupiter}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    deploy:
      resources:
        limits:
          memory: 512M

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          memory: 3.5G
          cpus: "4"

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jupiter}:${POSTGRES_PASSWORD:-jupiter_secret}@postgres:5432/${POSTGRES_DB:-jupiter}
      - QDRANT_HOST=qdrant
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - storage_data:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  storage_data:
